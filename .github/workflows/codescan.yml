name: SonarScan
on:
  push:
    branches: ["deploying"]
  pull_request:
    branches: ["deploying"]

jobs:
  build:
    name: Build and SonarScan
    runs-on: ubuntu-latest

    steps:

      - name: Clone to VM 
        uses: actions/checkout@v4
      
      - name: Sonar Initialize
        uses: SonarSource/sonarqube-scan-action@v6
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      
      - name: Success-Email
        if: job.status == 'Success'
        uses: dawidd6/action-send-mail@v3
        with: 
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ SonarQube Scan Passed"
          body: |
            ✅ Good news!

            Your SonarQube scan PASSED.

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Status: SUCCESS
          to: praveeneswarmadhes@gmail.com
          from: praveeneswarmadhes@gmail.com


      - name: Failed-Email
        if: job.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with: 
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: " SonarQube Scan Failed"
          body: |
            Check the pipeline!

            Your SonarQube scan Failed.

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Status: FAILURE
          to: praveeneswarmadhes@gmail.com
          from: praveeneswarmadhes@gmail.com